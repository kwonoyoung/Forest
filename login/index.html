<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인 | 트리샘</title><link rel="stylesheet" href="../css/app.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="../">◒ 트리샘</a><h1>관리자 로그인</h1><p>Firebase Authentication에 등록되고 Firestore의 <code>admins/{uid}</code>에서 활성화된 관리자만 접속할 수 있습니다.</p><div id="notice" class="notice" role="status"></div><form id="loginForm"><label class="field">관리자 ID(이메일)<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label class="field">비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button id="submitButton" class="btn" style="width:100%;margin-top:20px">로그인</button></form><a href="../" class="muted" style="display:block;text-align:center;margin-top:20px;font-size:13px">← 첫 화면으로</a></main><script type="module" src="../js/login.js"></script></body></html>
