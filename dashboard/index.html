<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>트리샘 수목 관리 대시보드</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#303431;font-family:Arial,'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{min-height:68px;padding:10px 4%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}.logo{color:#195441;font-size:24px;font-weight:700;text-decoration:none}.actions{display:flex;align-items:center;gap:9px}.user{font-size:12px;color:#66736d}.actions button,.primary{min-height:38px;padding:0 16px;border:0;border-radius:8px;background:#18533f;color:#fff}.secondary{min-height:38px;padding:0 14px;border:1px solid #ccd5d0;border-radius:8px;background:#fff;color:#28443a}.content{width:min(1236px,93%);margin:32px auto 70px}.status{display:none;padding:13px 15px;margin-bottom:18px;border-radius:9px}.status.show{display:block}.status.error{background:#fff0f0;color:#af2424}.status.ok{background:#eaf8ef;color:#116f3a}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 2px 5px #18372b14}.stat{height:130px;padding:23px 21px;display:flex;flex-direction:column;justify-content:space-between}.stat span{font-size:14px;color:#68706b}.stat b{font-size:31px;color:#194d3d}.good b{color:#14a94c}.normal b{color:#1977ee}.warn b{color:#d99a00}.danger b{color:#df2020}.trees{margin-top:30px}.tree-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.tree-head h2{font-size:19px;margin:0 0 6px;color:#174b3b}.tree-head p{margin:0;color:#6e7772;font-size:13px}.search{width:360px;height:42px;border:1px solid #d4d6d2;border-radius:8px;padding:0 12px}.tree-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tree{padding:22px}.tree-photo{width:100%;height:190px;object-fit:cover;border-radius:10px;margin-bottom:16px;background:#e8eeea}.tree-top{display:flex;justify-content:space-between;gap:12px}.tree h3{margin:0}.tree-top p{margin:8px 0 0;color:#777}.badge{height:28px;padding:5px 12px;border-radius:20px;font-size:13px;white-space:nowrap}.badge.양호{background:#e6f8ed;color:#0a9943}.badge.보통{background:#edf5ff;color:#2675d8}.badge.주의{background:#fff7df;color:#b87800}.badge.위험{background:#fff0f0;color:#d62626}.data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;padding:14px 0;border-block:1px solid #eee}.data span{display:block;font-size:12px;color:#888}.tree-buttons{display:flex;gap:8px}.tree-buttons button{height:36px;border:1px solid #d4d8d5;border-radius:7px;background:#fff}.tree-buttons .primary{flex:1;background:#18533f}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#777}.modal-bg{display:none;position:fixed;inset:0;background:#1238;z-index:20;place-items:center;padding:16px}.modal-bg.open{display:grid}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;padding:28px;border-radius:14px}.modal h2{margin-top:0;color:#174b3b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.modal label{display:block;font-size:13px;font-weight:700;margin:12px 0}.modal input,.modal select,.modal textarea{width:100%;margin-top:6px;border:1px solid #d6dcd8;border-radius:7px;padding:10px}.modal input,.modal select{height:42px}.modal textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.photo-box{margin-top:7px;padding:14px;border:1px dashed #aebdb5;border-radius:10px;background:#f7faf8}.photo-actions{display:flex;gap:8px;flex-wrap:wrap}.photo-actions label{margin:0;padding:10px 14px;border-radius:8px;background:#e9f3ed;color:#18533f;cursor:pointer}.photo-actions input{display:none}.photo-preview{display:none;width:100%;max-height:260px;object-fit:contain;margin-top:12px;border-radius:8px;background:#edf1ee}.photo-preview.show{display:block}.photo-help{display:block;margin-top:9px;color:#77817c;font-size:12px;font-weight:400}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.loading{padding:60px;text-align:center;color:#65716b}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.tree-grid{grid-template-columns:1fr}}@media(max-width:650px){header{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.user{width:100%;text-align:right}.logo{font-size:19px}.stats{grid-template-columns:1fr 1fr}.stat{height:108px;padding:17px}.tree-head{align-items:stretch;flex-direction:column;gap:12px}.search{width:100%}.content{width:calc(100% - 28px)}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <header><a class="logo" href="../">◒ 트리샘</a><div class="actions"><span id="userInfo" class="user">공개 샘플 체험 모드</span><button id="addButton" onclick="openTreeModal()">＋ 새 수목 추가</button><button class="secondary" onclick="location.href='../'">첫 화면</button></div></header>
  <main class="content"><div id="status" class="status" role="status"></div><section class="stats"><article class="card stat"><span>전체 수목</span><b id="total">0</b></article><article class="card stat good"><span>양호</span><b id="good">0</b></article><article class="card stat normal"><span>보통</span><b id="normal">0</b></article><article class="card stat warn"><span>주의</span><b id="warning">0</b></article><article class="card stat danger"><span>위험</span><b id="danger">0</b></article></section><section class="trees"><div class="tree-head"><div><h2>수목 데이터</h2><p>수목명, 위치, 관리번호로 검색하세요.</p></div><input class="search" id="search" oninput="renderTrees()" placeholder="소나무, 본관 앞, K-123..."></div><div class="tree-grid" id="treeGrid"><div class="card loading">데이터를 불러오는 중입니다.</div></div></section></main>
  <div class="modal-bg" id="treeModal"><form class="modal" id="treeForm"><h2 id="modalTitle">새 수목 추가</h2><input id="treeId" type="hidden"><div class="fields"><label>관리번호 *<input id="assetNo" required placeholder="예: K-125"></label><label>수목명 *<input id="treeName" required placeholder="예: 은행나무"></label><label>수종/과명<input id="species" placeholder="예: 은행나무과"></label><label>학명<input id="scientificName" placeholder="예: Ginkgo biloba"></label><label>위치 *<input id="treeLocation" required placeholder="예: 후관 화단"></label><label>수량<input id="quantity" type="number" min="1" value="1"></label><label>높이(m)<input id="heightM" type="number" min="0" step="0.01"></label><label>흉고직경(cm)<input id="diameterCm" type="number" min="0" step="0.01"></label><label>식재 연도<input id="plantedYear" type="number" min="1800" max="2200"></label><label>건강 상태<select id="healthStatus"><option>양호</option><option>보통</option><option>주의</option><option>위험</option></select></label><label>관리 상태<select id="managementStatus"><option>관리중</option><option>치료중</option><option>이식예정</option><option>제거예정</option><option>관리종료</option></select></label><div class="wide"><strong style="font-size:13px">수목 사진</strong><div class="photo-box"><div class="photo-actions"><label>📷 사진 촬영<input id="cameraInput" type="file" accept="image/*" capture="environment" onchange="selectPhoto(this)"></label><label>🖼 갤러리·파일 선택<input id="galleryInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" onchange="selectPhoto(this)"></label></div><img id="photoPreview" class="photo-preview" alt="선택한 수목 사진 미리보기"><span id="photoHelp" class="photo-help">JPG, PNG, WEBP, HEIC · 최대 8MB</span></div></div><label class="wide">비고<textarea id="notes"></textarea></label></div><div class="modal-foot"><button type="button" class="secondary" onclick="closeTreeModal()">취소</button><button id="saveButton" class="primary">저장하기</button></div></form></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.min.js"></script><script src="../js/supabase-config.js?v=20260805-2"></script>
  <script>
    const client=window.forestSupabase;const activeDemoVisitor=window.forestDemoVisitor;let trees=[],selectedPhotoFile=null,previewObjectUrl='';
    const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function show(message,type='error'){const el=$('status');el.textContent=message;el.className='status show '+type;setTimeout(()=>el.className='status',5000)}
    async function init(){$('userInfo').textContent='로그인 없는 공개 샘플 체험 · 추가 데이터는 24시간 후 정리';await loadTrees()}
    async function loadTrees(){const {data,error}=await client.from('demo_trees_public').select('*').order('asset_no');if(error){show('수목 데이터를 불러오지 못했습니다: '+error.message);$('treeGrid').innerHTML='<div class="card empty">데이터를 불러오지 못했습니다.</div>';return}trees=data||[];updateStats();renderTrees()}
    function updateStats(){const counts={양호:0,보통:0,주의:0,위험:0};trees.forEach(t=>counts[t.health_status]=(counts[t.health_status]||0)+1);$('total').textContent=trees.length;$('good').textContent=counts.양호;$('normal').textContent=counts.보통;$('warning').textContent=counts.주의;$('danger').textContent=counts.위험}
    function renderTrees(){const q=$('search').value.trim().toLowerCase();const list=trees.filter(t=>`${t.name} ${t.location} ${t.asset_no} ${t.species||''}`.toLowerCase().includes(q));$('treeGrid').innerHTML=list.length?list.map(t=>`<article class="card tree">${t.photo_url?`<img class="tree-photo" src="${esc(t.photo_url)}" alt="${esc(t.name)} 사진" loading="lazy">`:''}<div class="tree-top"><div><h3>${esc(t.name)}</h3><p>⌖ ${esc(t.location)}</p></div><span class="badge ${esc(t.health_status)}">${esc(t.health_status)}</span></div><div class="data"><div><span>높이</span><b>${t.height_m==null?'-':esc(t.height_m)+'m'}</b></div><div><span>흉고직경</span><b>${t.diameter_cm==null?'-':esc(t.diameter_cm)+'cm'}</b></div><div><span>관리번호</span><b>${esc(t.asset_no)}</b></div></div><div class="tree-buttons"><button class="primary" onclick="showDetails('${t.id}')">상세 정보</button>${t.is_owned?`<button onclick="openTreeModal('${t.id}')">수정</button><button onclick="deleteTree('${t.id}')">삭제</button>`:'<button disabled title="기본 샘플 또는 다른 방문자의 데이터">읽기 전용</button>'}</div></article>`).join(''):'<div class="card empty">검색 결과가 없습니다.</div>'}
    function values(t={}){$('treeId').value=t.id||'';$('assetNo').value=t.asset_no||'';$('treeName').value=t.name||'';$('species').value=t.species||'';$('scientificName').value=t.scientific_name||'';$('treeLocation').value=t.location||'';$('quantity').value=t.quantity||1;$('heightM').value=t.height_m??'';$('diameterCm').value=t.diameter_cm??'';$('plantedYear').value=t.planted_year??'';$('healthStatus').value=t.health_status||'양호';$('managementStatus').value=t.management_status||'관리중';$('notes').value=t.notes||'';selectedPhotoFile=null;if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=''}$('cameraInput').value='';$('galleryInput').value='';if(t.photo_url){$('photoPreview').src=t.photo_url;$('photoPreview').classList.add('show');$('photoHelp').textContent='현재 등록된 사진 · 새 사진을 선택하면 교체됩니다.'}else{$('photoPreview').removeAttribute('src');$('photoPreview').classList.remove('show');$('photoHelp').textContent='JPG, PNG, WEBP, HEIC · 최대 8MB'}}
    function selectPhoto(input){const file=input.files&&input.files[0];if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(!file.type.startsWith('image/')&&!['jpg','jpeg','png','webp','heic','heif'].includes(ext)){show('이미지 파일만 등록할 수 있습니다.');input.value='';return}if(file.size>8*1024*1024){show('사진은 8MB 이하만 등록할 수 있습니다.');input.value='';return}selectedPhotoFile=file;if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=URL.createObjectURL(file);$('photoPreview').src=previewObjectUrl;$('photoPreview').classList.add('show');$('photoHelp').textContent=`선택됨: ${file.name} · ${(file.size/1024/1024).toFixed(2)}MB`}
    function openTreeModal(id=''){const t=trees.find(x=>x.id===id);values(t);$('modalTitle').textContent=t?'수목 정보 수정':'새 수목 추가';$('treeModal').classList.add('open')}
    function closeTreeModal(){$('treeModal').classList.remove('open');$('treeForm').reset();values()}
    function nullableNumber(id){const v=$(id).value;return v===''?null:Number(v)}
    function photoExtension(file){const fromName=(file.name.split('.').pop()||'').toLowerCase();if(['jpg','jpeg','png','webp','heic','heif'].includes(fromName))return fromName;return ({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/heif':'heif'})[file.type]||'jpg'}
    async function uploadPhoto(file){const ext=photoExtension(file),path=`${activeDemoVisitor}/${crypto.randomUUID()}.${ext}`,contentType=file.type||({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'})[ext];const {error}=await client.storage.from('demo-tree-photos').upload(path,file,{contentType,upsert:false});if(error)throw error;const {data}=client.storage.from('demo-tree-photos').getPublicUrl(path);return {path,url:data.publicUrl}}
    $('treeForm').onsubmit=async event=>{event.preventDefault();const id=$('treeId').value,current=trees.find(t=>t.id===id),payload={asset_no:$('assetNo').value.trim(),name:$('treeName').value.trim(),species:$('species').value.trim()||null,scientific_name:$('scientificName').value.trim()||null,location:$('treeLocation').value.trim(),quantity:Number($('quantity').value||1),height_m:nullableNumber('heightM'),diameter_cm:nullableNumber('diameterCm'),planted_year:nullableNumber('plantedYear'),health_status:$('healthStatus').value,management_status:$('managementStatus').value,notes:$('notes').value.trim()||null};let uploaded=null;$('saveButton').disabled=true;$('saveButton').textContent=selectedPhotoFile?'사진 업로드 중...':'저장 중...';try{if(selectedPhotoFile){uploaded=await uploadPhoto(selectedPhotoFile);payload.photo_url=uploaded.url;payload.photo_path=uploaded.path}const result=id?await client.from('demo_trees').update(payload).eq('id',id):await client.from('demo_trees').insert({...payload,visitor_token:activeDemoVisitor});if(result.error)throw result.error;if(uploaded&&current?.photo_path)await client.storage.from('demo-tree-photos').remove([current.photo_path]);closeTreeModal();show(id?'수목 정보와 사진이 수정되었습니다.':'새 수목과 사진이 등록되었습니다.','ok');await loadTrees()}catch(error){if(uploaded)await client.storage.from('demo-tree-photos').remove([uploaded.path]);show('저장하지 못했습니다: '+(error.message||error))}finally{$('saveButton').disabled=false;$('saveButton').textContent='저장하기'}};
    function showDetails(id){const t=trees.find(x=>x.id===id);if(!t)return;alert(`관리번호: ${t.asset_no}\n수목명: ${t.name}\n수종: ${t.species||'-'}\n학명: ${t.scientific_name||'-'}\n위치: ${t.location}\n건강 상태: ${t.health_status}\n관리 상태: ${t.management_status}\n비고: ${t.notes||'-'}`)}
    async function deleteTree(id){const t=trees.find(x=>x.id===id);if(!t||!confirm(`${t.name}(${t.asset_no}) 데이터를 삭제할까요?`))return;const {error}=await client.from('demo_trees').delete().eq('id',id);if(error){show('삭제하지 못했습니다: '+error.message);return}if(t.photo_path)await client.storage.from('demo-tree-photos').remove([t.photo_path]);show('수목 데이터와 등록 사진이 삭제되었습니다.','ok');await loadTrees()}
    async function logout(){await client.auth.signOut();location.replace('../login/')}
    $('treeModal').onclick=e=>{if(e.target===$('treeModal'))closeTreeModal()};init();
  </script>
</body>
</html>
