<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>트리샘 수목 관리 대시보드</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#303431;font-family:Arial,'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{min-height:68px;padding:10px 4%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}.logo{color:#195441;font-size:24px;font-weight:700;text-decoration:none}.actions{display:flex;align-items:center;gap:9px}.user{font-size:12px;color:#66736d}.actions button,.primary{min-height:38px;padding:0 16px;border:0;border-radius:8px;background:#18533f;color:#fff}.secondary{min-height:38px;padding:0 14px;border:1px solid #ccd5d0;border-radius:8px;background:#fff;color:#28443a}.danger-button{color:#bc2e2e!important}.content{width:min(1236px,93%);margin:32px auto 70px}.status{display:none;padding:13px 15px;margin-bottom:18px;border-radius:9px}.status.show{display:block}.status.error{background:#fff0f0;color:#af2424}.status.ok{background:#eaf8ef;color:#116f3a}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 2px 5px #18372b14}.stat{height:130px;padding:23px 21px;display:flex;flex-direction:column;justify-content:space-between}.stat span{font-size:14px;color:#68706b}.stat b{font-size:31px;color:#194d3d}.good b{color:#14a94c}.normal b{color:#1977ee}.warn b{color:#d99a00}.danger b{color:#df2020}.trees{margin-top:30px}.tree-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.tree-head h2{font-size:19px;margin:0 0 6px;color:#174b3b}.tree-head p{margin:0;color:#6e7772;font-size:13px}.search{width:390px;height:42px;border:1px solid #d4d6d2;border-radius:8px;padding:0 12px}.tree-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tree{padding:22px}.tree-photo{width:100%;height:210px;object-fit:cover;border-radius:10px;margin-bottom:16px;background:#e8eeea}.tree-photo.placeholder{display:grid;place-items:center;color:#7a8b82;font-size:44px}.tree-top{display:flex;justify-content:space-between;gap:12px}.tree h3{margin:0}.tree-top p{margin:8px 0 0;color:#777}.badge{height:28px;padding:5px 12px;border-radius:20px;font-size:13px;white-space:nowrap}.badge.양호{background:#e6f8ed;color:#0a9943}.badge.보통{background:#edf5ff;color:#2675d8}.badge.주의{background:#fff7df;color:#b87800}.badge.위험{background:#fff0f0;color:#d62626}.badge.미점검{background:#f0f1f0;color:#6d746f}.data{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:16px 0;padding:14px 0;border-block:1px solid #eee}.data span{display:block;font-size:12px;color:#888;margin-bottom:4px}.data b{font-size:14px}.tree audio{width:100%;height:38px;margin:0 0 14px}.tree-buttons{display:flex;gap:8px;flex-wrap:wrap}.tree-buttons button{height:36px;border:1px solid #d4d8d5;border-radius:7px;background:#fff;padding:0 12px}.tree-buttons .primary{flex:1;background:#18533f}.tree-buttons button:disabled{cursor:not-allowed;opacity:.55}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#777}.modal-bg{display:none;position:fixed;inset:0;background:#1238;z-index:20;place-items:center;padding:16px}.modal-bg.open{display:grid}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;padding:28px;border-radius:14px}.modal.detail-modal{width:min(900px,100%)}.modal h2{margin-top:0;color:#174b3b}.section-title{grid-column:1/-1;margin:20px 0 2px;padding:12px 0 8px;border-bottom:2px solid #e4ebe7;color:#174b3b;font-size:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.modal label{display:block;font-size:13px;font-weight:700;margin:12px 0}.modal input,.modal select,.modal textarea{width:100%;margin-top:6px;border:1px solid #d6dcd8;border-radius:7px;padding:10px}.modal input,.modal select{height:42px}.modal textarea{min-height:78px;resize:vertical}.wide{grid-column:1/-1}.upload-box{margin-top:7px;padding:14px;border:1px dashed #aebdb5;border-radius:10px;background:#f7faf8}.upload-actions{display:flex;gap:8px;flex-wrap:wrap}.upload-actions label{margin:0;padding:10px 14px;border-radius:8px;background:#e9f3ed;color:#18533f;cursor:pointer}.upload-actions input{display:none}.photo-preview{display:none;width:100%;max-height:270px;object-fit:contain;margin-top:12px;border-radius:8px;background:#edf1ee}.photo-preview.show{display:block}.audio-preview{display:none;width:100%;margin-top:12px}.audio-preview.show{display:block}.upload-help{display:block;margin-top:9px;color:#77817c;font-size:12px;font-weight:400}.log-fields{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;padding:0 14px 12px;margin-top:8px;border-radius:10px;background:#f7faf8}.log-fields .wide{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.loading{padding:60px;text-align:center;color:#65716b}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px}.detail-item{padding:12px;border-bottom:1px solid #edf0ee}.detail-item span{display:block;color:#78817c;font-size:12px;margin-bottom:5px}.detail-media{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.detail-media img{width:100%;height:250px;object-fit:contain;border-radius:10px;background:#eef2ef}.detail-media audio{width:100%;margin-top:10px}.journal{margin-top:24px}.journal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid #e4ebe7}.journal-head h3{color:#174b3b}.log-list{display:grid;gap:10px;margin-top:13px}.log{padding:14px;border:1px solid #e2e8e4;border-radius:9px;background:#fafcfb}.log-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.log p{margin:4px 0;color:#58635d;font-size:13px;line-height:1.6}.money{text-align:right;font-variant-numeric:tabular-nums}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.tree-grid{grid-template-columns:1fr}}@media(max-width:650px){header{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.user{width:100%;text-align:right}.logo{font-size:19px}.stats{grid-template-columns:1fr 1fr}.stat{height:108px;padding:17px}.tree-head{align-items:stretch;flex-direction:column;gap:12px}.search{width:100%}.content{width:calc(100% - 28px)}.fields,.log-fields,.detail-grid,.detail-media{grid-template-columns:1fr}.wide,.log-fields .wide{grid-column:auto}.modal{padding:21px}.tree-buttons button{flex:1}.tree-buttons .primary{flex-basis:100%}}
  </style>
</head>
<body>
  <header><a class="logo" href="../">◒ 트리샘</a><div class="actions"><span id="userInfo" class="user">공개 샘플 체험 모드</span><button id="addButton" type="button">＋ 새 수목 추가</button><button class="secondary" type="button" onclick="location.href='../'">첫 화면</button></div></header>
  <main class="content"><div id="status" class="status" role="status"></div><section class="stats"><article class="card stat"><span>전체 수목</span><b id="total">0</b></article><article class="card stat good"><span>양호</span><b id="good">0</b></article><article class="card stat normal"><span>보통</span><b id="normal">0</b></article><article class="card stat warn"><span>주의</span><b id="warning">0</b></article><article class="card stat danger"><span>위험</span><b id="danger">0</b></article></section><section class="trees"><div class="tree-head"><div><h2>수목 재산정보</h2><p>대장번호, 명칭, 재산종류, 재산종목으로 검색하세요.</p></div><input class="search" id="search" placeholder="대장번호 또는 명칭 검색"></div><div class="tree-grid" id="treeGrid"><div class="card loading">데이터를 불러오는 중입니다.</div></div></section></main>

  <div class="modal-bg" id="treeModal"><form class="modal" id="treeForm"><h2 id="modalTitle">새 수목 추가</h2><input id="treeId" type="hidden"><div class="fields">
    <h3 class="section-title">기본 재산정보</h3>
    <label>대장번호 *<input id="assetNo" required placeholder="예: K-125"></label><label>명칭 *<input id="treeName" required placeholder="예: 은행나무"></label>
    <label>재산종류<input id="propertyType" placeholder="예: 행정재산"></label><label>재산종목<input id="propertyItem" placeholder="예: 입목죽"></label>
    <label>재산구분<input id="propertyClassification" placeholder="예: 교육용"></label><label>취득일자<input id="acquisitionDate" type="date"></label>
    <label>취득금액(원)<input id="acquisitionAmount" type="number" min="0" step="1" inputmode="numeric"></label><label>현재금액(원)<input id="currentAmount" type="number" min="0" step="1" inputmode="numeric"></label>
    <h3 class="section-title">수목사진</h3>
    <div class="wide"><div class="upload-box"><div class="upload-actions"><label>📷 사진 촬영<input id="cameraInput" type="file" accept="image/*" capture="environment"></label><label>🖼 사진 선택<input id="galleryInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label></div><img id="photoPreview" class="photo-preview" alt="선택한 수목 사진 미리보기"><span id="photoHelp" class="upload-help">JPG, PNG, WEBP, HEIC · 최대 8MB</span></div></div>
    <h3 class="section-title">나무이야기 음성</h3>
    <div class="wide"><div class="upload-box"><div class="upload-actions"><label>🎵 음성파일 선택<input id="audioInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.webm"></label></div><audio id="audioPreview" class="audio-preview" controls preload="metadata"></audio><span id="audioHelp" class="upload-help">MP3, WAV, M4A, AAC, OGG, WEBM · 최대 20MB · 공개 체험 음원은 누구나 재생할 수 있습니다.</span></div></div>
    <h3 class="section-title">관리일지 추가 <small style="font-weight:400;color:#77817c">(선택사항)</small></h3>
    <div class="log-fields"><label>점검일자<input id="inspectionDate" type="date"></label><label>점검자<input id="inspector" placeholder="예: 홍길동"></label><label>점검상태<select id="inspectionStatus"><option>양호</option><option>보통</option><option>주의</option><option>위험</option></select></label><label>점검조치<input id="inspectionAction" placeholder="예: 전정 및 지주목 보강"></label><label class="wide">특이사항<textarea id="inspectionNotes" placeholder="점검 중 확인한 내용을 입력하세요."></textarea></label></div>
  </div><div class="modal-foot"><button type="button" class="secondary" id="treeCancel">취소</button><button id="saveButton" class="primary">저장하기</button></div></form></div>

  <div class="modal-bg" id="detailModal"><div class="modal detail-modal"><h2 id="detailTitle">수목 상세정보</h2><div id="detailContent"></div><div class="modal-foot"><button type="button" class="secondary" id="detailClose">닫기</button></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.min.js"></script><script src="../js/supabase-config.js?v=20260805-3"></script>
  <script>
    const client=window.forestSupabase,activeDemoVisitor=window.forestDemoVisitor;
    let trees=[],logs=[],selectedPhotoFile=null,selectedAudioFile=null,photoObjectUrl='',audioObjectUrl='';
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const today=()=>new Date().toISOString().slice(0,10);
    const money=value=>value==null||value===''?'-':Number(value).toLocaleString('ko-KR')+'원';
    function show(message,type='error'){const el=$('status');el.textContent=message;el.className='status show '+type;setTimeout(()=>el.className='status',6000)}
    function latestLog(treeId){return logs.filter(l=>l.tree_id===treeId).sort((a,b)=>String(b.inspection_date).localeCompare(String(a.inspection_date))||String(b.created_at).localeCompare(String(a.created_at)))[0]||null}
    async function init(){$('userInfo').textContent='로그인 없는 공개 샘플 체험 · 추가 데이터는 24시간 후 정리';$('inspectionDate').value=today();await loadData()}
    async function loadData(){const [treeResult,logResult]=await Promise.all([client.from('demo_trees_public').select('*').order('asset_no'),client.from('demo_tree_management_logs_public').select('*').order('inspection_date',{ascending:false})]);if(treeResult.error){show('수목 데이터를 불러오지 못했습니다: '+treeResult.error.message);$('treeGrid').innerHTML='<div class="card empty">데이터를 불러오지 못했습니다.</div>';return}if(logResult.error)show('관리일지를 불러오지 못했습니다: '+logResult.error.message);trees=treeResult.data||[];logs=logResult.data||[];updateStats();renderTrees()}
    function updateStats(){const counts={양호:0,보통:0,주의:0,위험:0};trees.forEach(t=>{const l=latestLog(t.id);if(l)counts[l.inspection_status]=(counts[l.inspection_status]||0)+1});$('total').textContent=trees.length;$('good').textContent=counts.양호;$('normal').textContent=counts.보통;$('warning').textContent=counts.주의;$('danger').textContent=counts.위험}
    function renderTrees(){const q=$('search').value.trim().toLowerCase();const list=trees.filter(t=>([t.asset_no,t.name,t.property_type,t.property_item,t.property_classification].join(' ')).toLowerCase().includes(q));$('treeGrid').innerHTML=list.length?list.map(t=>{const l=latestLog(t.id),status=l?l.inspection_status:'미점검',audio=t.audio_url?'<audio controls preload="metadata" src="'+esc(t.audio_url)+'"></audio>':'';return '<article class="card tree">'+(t.photo_url?'<img class="tree-photo" src="'+esc(t.photo_url)+'" alt="'+esc(t.name)+' 사진" loading="lazy">':'<div class="tree-photo placeholder" aria-label="등록된 사진 없음">🌳</div>')+'<div class="tree-top"><div><h3>'+esc(t.name)+'</h3><p>대장번호 '+esc(t.asset_no)+'</p></div><span class="badge '+esc(status)+'">'+esc(status)+'</span></div><div class="data"><div><span>재산종류</span><b>'+esc(t.property_type||'-')+'</b></div><div><span>재산종목</span><b>'+esc(t.property_item||'-')+'</b></div><div><span>취득금액</span><b>'+esc(money(t.acquisition_amount))+'</b></div><div><span>현재금액</span><b>'+esc(money(t.current_amount))+'</b></div></div>'+audio+'<div class="tree-buttons"><button class="primary" type="button" data-action="detail" data-id="'+t.id+'">상세정보·관리일지</button>'+(t.is_owned?'<button type="button" data-action="edit" data-id="'+t.id+'">수정</button><button class="danger-button" type="button" data-action="delete" data-id="'+t.id+'">삭제</button>':'<button disabled title="기본 샘플 또는 다른 방문자의 데이터">읽기 전용</button>')+'</div></article>'}).join(''):'<div class="card empty">검색 결과가 없습니다.</div>'}
    function resetUploads(t={}){selectedPhotoFile=null;selectedAudioFile=null;if(photoObjectUrl){URL.revokeObjectURL(photoObjectUrl);photoObjectUrl=''}if(audioObjectUrl){URL.revokeObjectURL(audioObjectUrl);audioObjectUrl=''}$('cameraInput').value='';$('galleryInput').value='';$('audioInput').value='';if(t.photo_url){$('photoPreview').src=t.photo_url;$('photoPreview').classList.add('show');$('photoHelp').textContent='현재 사진 · 새 사진을 선택하면 교체됩니다.'}else{$('photoPreview').removeAttribute('src');$('photoPreview').classList.remove('show');$('photoHelp').textContent='JPG, PNG, WEBP, HEIC · 최대 8MB'}if(t.audio_url){$('audioPreview').src=t.audio_url;$('audioPreview').classList.add('show');$('audioHelp').textContent='현재 음원: '+(t.audio_name||'등록 음원')+' · 새 파일을 선택하면 교체됩니다.'}else{$('audioPreview').removeAttribute('src');$('audioPreview').classList.remove('show');$('audioHelp').textContent='MP3, WAV, M4A, AAC, OGG, WEBM · 최대 20MB · 공개 체험 음원은 누구나 재생할 수 있습니다.'}}
    function fillForm(t={}){$('treeId').value=t.id||'';$('assetNo').value=t.asset_no||'';$('treeName').value=t.name||'';$('propertyType').value=t.property_type||'';$('propertyItem').value=t.property_item||'';$('propertyClassification').value=t.property_classification||'';$('acquisitionDate').value=t.acquisition_date||'';$('acquisitionAmount').value=t.acquisition_amount??'';$('currentAmount').value=t.current_amount??'';$('inspectionDate').value=today();$('inspector').value='';$('inspectionStatus').value='양호';$('inspectionAction').value='';$('inspectionNotes').value='';resetUploads(t)}
    function openTreeModal(id=''){const t=trees.find(x=>x.id===id);fillForm(t);$('modalTitle').textContent=t?'수목 정보 수정':'새 수목 추가';$('treeModal').classList.add('open')}
    function closeTreeModal(){$('treeModal').classList.remove('open');$('treeForm').reset();fillForm()}
    function selectPhoto(input){const file=input.files&&input.files[0];if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(!file.type.startsWith('image/')&&!['jpg','jpeg','png','webp','heic','heif'].includes(ext)){show('이미지 파일만 등록할 수 있습니다.');input.value='';return}if(file.size>8*1024*1024){show('사진은 8MB 이하만 등록할 수 있습니다.');input.value='';return}selectedPhotoFile=file;if(photoObjectUrl)URL.revokeObjectURL(photoObjectUrl);photoObjectUrl=URL.createObjectURL(file);$('photoPreview').src=photoObjectUrl;$('photoPreview').classList.add('show');$('photoHelp').textContent='선택됨: '+file.name+' · '+(file.size/1024/1024).toFixed(2)+'MB'}
    function selectAudio(input){const file=input.files&&input.files[0];if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(!file.type.startsWith('audio/')&&!['mp3','wav','m4a','aac','ogg','webm'].includes(ext)){show('MP3, WAV 등 음성 파일만 등록할 수 있습니다.');input.value='';return}if(file.size>20*1024*1024){show('음성 파일은 20MB 이하만 등록할 수 있습니다.');input.value='';return}selectedAudioFile=file;if(audioObjectUrl)URL.revokeObjectURL(audioObjectUrl);audioObjectUrl=URL.createObjectURL(file);$('audioPreview').src=audioObjectUrl;$('audioPreview').classList.add('show');$('audioHelp').textContent='선택됨: '+file.name+' · '+(file.size/1024/1024).toFixed(2)+'MB'}
    function extension(file,fallback){return (file.name.split('.').pop()||fallback).toLowerCase().replace(/[^a-z0-9]/g,'')||fallback}
    async function upload(bucket,file,fallback){const path=activeDemoVisitor+'/'+crypto.randomUUID()+'.'+extension(file,fallback);const result=await client.storage.from(bucket).upload(path,file,{contentType:file.type||undefined,upsert:false});if(result.error)throw result.error;const pub=client.storage.from(bucket).getPublicUrl(path);return {path:path,url:pub.data.publicUrl}}
    async function addLog(treeId){const inspector=$('inspector').value.trim(),action=$('inspectionAction').value.trim(),notes=$('inspectionNotes').value.trim();if(!inspector&&!action&&!notes)return;if(!inspector){throw new Error('관리일지를 입력하려면 점검자를 입력해 주세요.')}const result=await client.from('demo_tree_management_logs').insert({tree_id:treeId,inspection_date:$('inspectionDate').value||today(),inspector:inspector,inspection_status:$('inspectionStatus').value,inspection_action:action||null,notes:notes||null,visitor_token:activeDemoVisitor});if(result.error)throw result.error}
    $('treeForm').addEventListener('submit',async event=>{event.preventDefault();const id=$('treeId').value,current=trees.find(t=>t.id===id),payload={asset_no:$('assetNo').value.trim(),name:$('treeName').value.trim(),property_type:$('propertyType').value.trim()||null,property_item:$('propertyItem').value.trim()||null,property_classification:$('propertyClassification').value.trim()||null,acquisition_date:$('acquisitionDate').value||null,acquisition_amount:$('acquisitionAmount').value===''?null:Number($('acquisitionAmount').value),current_amount:$('currentAmount').value===''?null:Number($('currentAmount').value)};let photoUpload=null,audioUpload=null,treeId=id;$('saveButton').disabled=true;$('saveButton').textContent='저장 중...';try{if(selectedPhotoFile){$('saveButton').textContent='사진 업로드 중...';photoUpload=await upload('demo-tree-photos',selectedPhotoFile,'jpg');payload.photo_url=photoUpload.url;payload.photo_path=photoUpload.path}if(selectedAudioFile){$('saveButton').textContent='음성 업로드 중...';audioUpload=await upload('demo-tree-audio',selectedAudioFile,'mp3');payload.audio_url=audioUpload.url;payload.audio_path=audioUpload.path;payload.audio_name=selectedAudioFile.name}let result;if(id){result=await client.from('demo_trees').update(payload).eq('id',id).select('id').single()}else{result=await client.from('demo_trees').insert(Object.assign({},payload,{visitor_token:activeDemoVisitor})).select('id').single()}if(result.error)throw result.error;treeId=result.data.id;await addLog(treeId);if(photoUpload&&current&&current.photo_path)await client.storage.from('demo-tree-photos').remove([current.photo_path]);if(audioUpload&&current&&current.audio_path)await client.storage.from('demo-tree-audio').remove([current.audio_path]);closeTreeModal();show(id?'수목 정보가 수정되었습니다.':'새 수목이 등록되었습니다.','ok');await loadData()}catch(error){if(photoUpload)await client.storage.from('demo-tree-photos').remove([photoUpload.path]);if(audioUpload)await client.storage.from('demo-tree-audio').remove([audioUpload.path]);show('저장하지 못했습니다: '+(error.message||error))}finally{$('saveButton').disabled=false;$('saveButton').textContent='저장하기'}});
    function showDetails(id){const t=trees.find(x=>x.id===id);if(!t)return;const treeLogs=logs.filter(l=>l.tree_id===id).sort((a,b)=>String(b.inspection_date).localeCompare(String(a.inspection_date)));$('detailTitle').textContent=t.name+' 상세정보';const items=[['대장번호',t.asset_no],['명칭',t.name],['재산종류',t.property_type],['재산종목',t.property_item],['재산구분',t.property_classification],['취득일자',t.acquisition_date],['취득금액',money(t.acquisition_amount)],['현재금액',money(t.current_amount)]];const media=(t.photo_url||t.audio_url)?'<div class="detail-media">'+(t.photo_url?'<div><strong>수목사진</strong><img src="'+esc(t.photo_url)+'" alt="'+esc(t.name)+' 사진"></div>':'<div></div>')+(t.audio_url?'<div><strong>나무이야기</strong><p>'+esc(t.audio_name||'등록 음원')+'</p><audio controls preload="metadata" src="'+esc(t.audio_url)+'"></audio></div>':'')+'</div>':'';const journal=treeLogs.length?treeLogs.map(l=>'<article class="log"><div class="log-top"><b>'+esc(l.inspection_date)+'</b><span class="badge '+esc(l.inspection_status)+'">'+esc(l.inspection_status)+'</span></div><p><b>점검자:</b> '+esc(l.inspector)+'</p><p><b>점검조치:</b> '+esc(l.inspection_action||'-')+'</p><p><b>특이사항:</b> '+esc(l.notes||'-')+'</p></article>').join(''):'<div class="empty">등록된 관리일지가 없습니다.</div>';$('detailContent').innerHTML='<div class="detail-grid">'+items.map(x=>'<div class="detail-item"><span>'+x[0]+'</span><b>'+esc(x[1]||'-')+'</b></div>').join('')+'</div>'+media+'<section class="journal"><div class="journal-head"><h3>관리일지</h3><span>총 '+treeLogs.length+'건</span></div><div class="log-list">'+journal+'</div></section>';$('detailModal').classList.add('open')}
    async function deleteTree(id){const t=trees.find(x=>x.id===id);if(!t||!confirm(t.name+'('+t.asset_no+') 수목 정보와 관리일지를 삭제할까요?'))return;const result=await client.from('demo_trees').delete().eq('id',id);if(result.error){show('삭제하지 못했습니다: '+result.error.message);return}if(t.photo_path)await client.storage.from('demo-tree-photos').remove([t.photo_path]);if(t.audio_path)await client.storage.from('demo-tree-audio').remove([t.audio_path]);show('수목 정보, 음원 및 관리일지가 삭제되었습니다.','ok');await loadData()}
    $('addButton').addEventListener('click',()=>openTreeModal());$('search').addEventListener('input',renderTrees);$('treeCancel').addEventListener('click',closeTreeModal);$('detailClose').addEventListener('click',()=>$('detailModal').classList.remove('open'));$('cameraInput').addEventListener('change',e=>selectPhoto(e.target));$('galleryInput').addEventListener('change',e=>selectPhoto(e.target));$('audioInput').addEventListener('change',e=>selectAudio(e.target));$('treeGrid').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(b.dataset.action==='detail')showDetails(b.dataset.id);if(b.dataset.action==='edit')openTreeModal(b.dataset.id);if(b.dataset.action==='delete')deleteTree(b.dataset.id)});$('treeModal').addEventListener('click',e=>{if(e.target===$('treeModal'))closeTreeModal()});$('detailModal').addEventListener('click',e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('open')});init();
  </script>
