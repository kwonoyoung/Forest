<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 대시보드 | 트리샘</title><link rel="stylesheet" href="../css/app.css"></head><body>
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="../">◒ 트리샘 관리자</a><div class="nav-actions"><span id="userLabel" class="muted" style="font-size:12px"></span><button id="addButton" class="btn">＋ 새 수목</button><button id="logoutButton" class="btn secondary">로그아웃</button></div></div></header>
<main class="container dashboard-main"><div id="notice" class="notice" role="status"></div><div class="dashboard-head"><div><h1>수목 관리 대시보드</h1><p>수목 재산정보, 스토리, 이미지, MP3 파일과 QR 연결주소를 관리합니다.</p></div><input id="search" class="search" placeholder="이름·ID·수종·위치 검색"></div><section class="stats"><article class="panel stat"><span>전체 수목</span><b id="total">0</b></article><article class="panel stat"><span>양호</span><b id="good">0</b></article><article class="panel stat"><span>주의/위험</span><b id="need">0</b></article><article class="panel stat"><span>음성 등록</span><b id="audioCount">0</b></article></section><section id="treeGrid" class="tree-grid"><div class="panel empty">로그인 상태를 확인하는 중입니다.</div></section></main>
<div id="treeModal" class="modal-backdrop"><form id="treeForm" class="modal"><div class="modal-head"><h2 id="modalTitle">새 수목 등록</h2><button id="closeModal" class="icon-btn" type="button" aria-label="닫기">×</button></div><div class="form-grid"><label class="field">수목 고유 ID *<input id="treeId" required maxlength="80" placeholder="예: TREE-001"></label><label class="field">나무 이름 *<input id="treeName" required maxlength="100" placeholder="예: 느티나무"></label><label class="field">대장번호<input id="assetNo" maxlength="100" placeholder="예: 입목-001"></label><label class="field">수종<input id="species" maxlength="100" placeholder="예: 느티나무"></label><label class="field">수령<input id="age" maxlength="100" placeholder="예: 약 80년"></label><label class="field">위치<input id="locationField" maxlength="200" placeholder="예: 본관 앞 운동장 동편"></label><label class="field">재산구분<input id="propertyType" maxlength="100" placeholder="예: 행정재산"></label><label class="field">관리상태<select id="statusField"><option>양호</option><option>보통</option><option>주의</option><option>위험</option><option>미점검</option></select></label><label class="field wide">스토리텔링 텍스트<textarea id="storyText" maxlength="10000" placeholder="이 나무와 학교에 얽힌 이야기를 입력하세요."></textarea></label><label class="field wide">수목 이미지<div class="file-box"><input id="imageFile" type="file" accept="image/*"><small class="muted">10MB 이하 이미지</small><img id="imagePreview" class="preview hidden" alt="수목 이미지 미리보기"></div></label><label class="field wide">음성 파일(MP3)<div class="file-box"><input id="audioFile" type="file" accept="audio/mpeg,.mp3"><small class="muted">MP3, 30MB 이하</small><audio id="audioPreview" class="hidden" controls style="width:100%;margin-top:10px"></audio></div></label></div><div class="form-actions"><button id="cancelButton" class="btn secondary" type="button">취소</button><button id="saveButton" class="btn" type="submit">저장</button></div></form></div>
<div id="qrModal" class="modal-backdrop"><div class="modal" style="width:min(520px,100%)"><div class="modal-head"><div><h2 id="qrTreeName">QR 연결</h2><div class="muted" style="margin-top:6px;font-size:13px">일반 사용자가 로그인 없이 보는 공개 페이지입니다.</div></div><button id="closeQr" class="icon-btn" type="button">×</button></div><div id="qrCanvas" class="qr-box"></div><div class="qr-url"><input id="qrUrl" readonly><button id="copyUrl" class="btn secondary" type="button">선택</button><button id="openPublic" class="btn" type="button">열기</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module" src="../js/dashboard.js"></script></body></html>
