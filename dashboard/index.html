<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>트리샘 수목 관리 대시보드</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#303431;font-family:Arial,sans-serif}button,input{font:inherit}header{height:68px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}.logo{color:#195441;font-size:24px;font-weight:700;text-decoration:none}.actions{display:flex;gap:9px}.actions button,.primary{height:38px;padding:0 16px;border:0;border-radius:8px;background:#18533f;color:#fff;cursor:pointer}.content{width:min(1236px,93%);margin:32px auto 70px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 2px 5px #18372b14}.stat{height:146px;padding:26px 22px;display:flex;flex-direction:column;justify-content:space-between}.stat span{font-size:14px;color:#68706b}.stat b{font-size:31px;color:#194d3d}.good b{color:#14b64f}.normal b{color:#1977ee}.warn b{color:#d99a00}.danger b{color:#e10000}.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}.chart{min-height:390px;padding:24px}.chart h2,.trees h2{font-size:16px;margin:0 0 6px}.chart>p,.trees p{margin:0;color:#68a043;font-size:13px}.plot{height:238px;margin:25px 8px 8px 58px;border-left:1px solid #aaa;border-bottom:1px solid #aaa;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,#ddd 60px)}.plot:before{content:'1';position:absolute;left:-25px;top:-7px;color:#777;font-size:13px}.plot:after{content:'0';position:absolute;left:-25px;bottom:-5px;color:#777;font-size:13px}.dot{position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:#3186ed}.bar{position:absolute;inset:0 10%;background:#3982e9}.month{position:absolute;bottom:-38px;left:46%;font-size:12px;color:#777;transform:rotate(-45deg)}.legend{text-align:center;margin-top:38px;font-size:13px;color:#477}.distribution{display:flex;flex-direction:column}.donut{width:205px;height:205px;margin:25px auto 0;border-radius:50%;background:#18bd59;display:grid;place-items:center;position:relative}.donut:before{content:'';position:absolute;width:112px;height:112px;border-radius:50%;background:#fff}.donut b{z-index:1;font-size:30px;color:#18533f}.summary-row{height:55px;margin-top:14px;padding:0 15px;border-radius:8px;display:flex;align-items:center;justify-content:space-between}.g{background:#eaf9ef;color:#079e46}.n{background:#eef5ff;color:#2582ee}.w{background:#fff8e5;color:#dc9800}.d{background:#fff0f0;color:#e22}.trees{margin-top:30px}.tree-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.search{width:360px;height:42px;border:1px solid #d4d6d2;border-radius:8px;padding:0 12px}.tree-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tree{padding:22px}.tree-top{display:flex;justify-content:space-between}.tree h3{margin:0}.tree-top p{color:#777}.badge{height:28px;padding:5px 12px;border-radius:20px;background:#e6f8ed;color:#0da348;font-size:13px}.data{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;padding:14px 0;border-block:1px solid #eee}.data span{display:block;font-size:12px;color:#888}.tree-buttons{display:flex;gap:8px}.tree-buttons button{height:36px;border:1px solid #d4d8d5;border-radius:7px;background:#fff;cursor:pointer}.tree-buttons .primary{flex:1}.modal-bg{display:none;position:fixed;inset:0;background:#1237;z-index:20;place-items:center}.modal{width:min(430px,90%);background:#fff;padding:28px;border-radius:14px}.modal label{display:block;font-size:13px;margin:12px 0}.modal input{width:100%;height:42px;margin-top:6px;border:1px solid #ddd;border-radius:7px;padding:0 10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px}.empty{padding:35px;text-align:center;color:#777}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.charts,.tree-grid{grid-template-columns:1fr}}@media(max-width:600px){header{padding:0 14px}.logo{font-size:19px}.actions button{font-size:12px;padding:0 9px}.stats{grid-template-columns:1fr 1fr}.stat{height:110px;padding:18px}.tree-head{align-items:stretch;flex-direction:column;gap:12px}.search{width:100%}.content{width:calc(100% - 30px)}}
</style></head><body><header><a class="logo" href="../">◒ 트리샘</a><div class="actions"><button>▦ QR 스캔</button><button onclick="openModal()">＋ 새 수목 추가</button></div></header><main class="content"><section class="stats"><article class="card stat"><span>전체 수목</span><b id="total">2</b></article><article class="card stat good"><span>양호</span><b id="good">2</b></article><article class="card stat normal"><span>보통</span><b>0</b></article><article class="card stat warn"><span>주의</span><b>0</b></article><article class="card stat danger"><span>위험</span><b>0</b></article></section><section class="charts"><article class="card chart"><h2>월별 점검 추이</h2><p>지난 12개월간의 점검 건수 변화</p><div class="plot"><i class="dot"></i><span class="month">2026-06</span></div><div class="legend">◉ 전체 점검</div></article><article class="card chart"><h2>월별 상태별 점검</h2><p>상태별 점검 건수 분포</p><div class="plot"><i class="bar"></i><span class="month">2026-06</span></div><div class="legend">■ 양호　<span style="color:#3486ed">■ 보통</span>　<span style="color:#efa900">■ 주의</span>　<span style="color:#e33">■ 위험</span></div></article><article class="card chart distribution"><h2>전체 상태 분포</h2><p>총 <span class="count">2</span>그루의 수목 상태</p><div class="donut"><b><span class="count">2</span><small style="display:block;font-size:11px">그루</small></b></div><div class="legend">■ 양호 <span class="count">2</span></div></article><article class="card chart"><h2>수목 현황 요약</h2><p>전체 수목 상태 통계</p><div class="summary-row g"><span>● 양호</span><b class="count">2</b></div><div class="summary-row n"><span>● 보통</span><b>0</b></div><div class="summary-row w"><span>● 주의</span><b>0</b></div><div class="summary-row d"><span>● 위험</span><b>0</b></div></article></section><section class="trees"><div class="tree-head"><div><h2>수목 검색</h2><p>수목명, 위치로 검색하세요</p></div><input class="search" id="search" oninput="render()" placeholder="소나무, 본관 화단 등..."></div><div class="tree-grid" id="treeGrid"></div></section></main><div class="modal-bg" id="modal"><form class="modal" onsubmit="addTree(event)"><h2>새 수목 추가</h2><label>수목명<input name="name" required placeholder="예: 은행나무"></label><label>위치<input name="location" required placeholder="예: 후관 화단"></label><label>자산번호<input name="id" placeholder="예: K-125"></label><div class="modal-foot"><button type="button" onclick="closeModal()">취소</button><button class="primary">추가하기</button></div></form></div><script>
let trees=[{id:'K-124',name:'느티나무',location:'운동장북쪽',height:'15m',diameter:'50cm'},{id:'K-123',name:'소나무',location:'본관 앞',height:'12m',diameter:'42cm'}];function update(){document.querySelectorAll('.count').forEach(e=>e.textContent=trees.length);total.textContent=trees.length;good.textContent=trees.length}function render(){let q=search.value.toLowerCase(),a=trees.filter(t=>(t.name+t.location+t.id).toLowerCase().includes(q));treeGrid.innerHTML=a.length?a.map(t=>`<article class="card tree"><div class="tree-top"><div><h3>${t.name}</h3><p>⌖ ${t.location}</p></div><span class="badge">양호</span></div><div class="data"><div><span>높이</span><b>${t.height}</b></div><div><span>근경</span><b>${t.diameter}</b></div><div><span>자산번호</span><b>${t.id}</b></div></div><div class="tree-buttons"><button class="primary">상세 정보</button><button>✎</button><button onclick="removeTree('${t.id}')">♲</button></div></article>`).join(''):'<div class="card empty">검색 결과가 없습니다.</div>'}function openModal(){modal.style.display='grid'}function closeModal(){modal.style.display='none'}function addTree(e){e.preventDefault();let f=new FormData(e.target);trees.push({id:f.get('id')||'K-'+(123+trees.length),name:f.get('name'),location:f.get('location'),height:'-',diameter:'-'});e.target.reset();closeModal();update();render()}function removeTree(id){trees=trees.filter(t=>t.id!==id);update();render()}render();
</script></body></html>
